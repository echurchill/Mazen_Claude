    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.style.height = `${height}px`;
    return { width, height };
  }

  function drawArrow(x1, y1, x2, y2, size) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - Math.cos(angle - 0.55) * size, y2 - Math.sin(angle - 0.55) * size);
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - Math.cos(angle + 0.55) * size, y2 - Math.sin(angle + 0.55) * size);
    ctx.stroke();
  }

  function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function panelCoord(rect, point) {
    return {
      x: rect.x + point.x * rect.size,
      y: rect.y + point.y * rect.size
    };
  }

  function easeInOut(t) {
    return t &lt; 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function interpolateMapping(from, to, t) {
    const length = Math.min(from.length, to.length);
    const mapping = [];
    for (let i = 0; i &lt; length; i += 1) {
      mapping.push({
        source: to[i].source,
        target: {
          x: from[i].target.x + (to[i].target.x - from[i].target.x) * t,
          y: from[i].target.y + (to[i].target.y - from[i].target.y) * t
        }
      });
    }
    return mapping;
  }

  function getRenderState(now) {
    const n = Number(cellsControl.value);
    if (!displayedMapping || displayedMapping.length !== n * n) {
      displayedMapping = buildMapping(targetControl.value, n);
      displayedKind = targetControl.value;
      transition = null;
    }

    if (!transition) {
      return { mapping: displayedMapping, progress: 1, transitioning: false };
    }

    const raw = clamp((now - transition.start) / transition.duration, 0, 1);
    const progress = easeInOut(raw);
    const mapping = interpolateMapping(transition.from, transition.to, progress);
    if (raw &gt;= 1) {
      displayedMapping = transition.to;
      displayedKind = transition.toKind;
      transition = null;
      return { mapping: displayedMapping, progress: 1, transitioning: false };
    }
    return { mapping, progress, transitioning: true, toKind: transition.toKind };
  }

  function scheduleDraw() {
    if (animationFrame) return;
    animationFrame = requestAnimationFrame((now) =&gt; {
      animationFrame = null;
      draw(now);
      if (transition) scheduleDraw();
    });
  }

  function snapshotMapping(now) {
    return getRenderState(now).mapping.map((ray) =&gt; ({
      source: ray.source,
      target: { x: ray.target.x, y: ray.target.y }
    }));
  }

  function startTargetTransition() {
    const n = Number(cellsControl.value);
    const nextKind = targetControl.value;
    const nextMapping = buildMapping(nextKind, n);
    const now = performance.now();
    const fromMapping = snapshotMapping(now);

    if (reduceMotion.matches || !fromMapping.length || fromMapping.length !== nextMapping.length) {
      transition = null;
      displayedMapping = nextMapping;
      displayedKind = nextKind;
      draw(now);
      return;
    }

    transition = {
      from: fromMapping,
      to: nextMapping,
      toKind: nextKind,
      start: now,
      duration: transitionMs
    };
    displayedKind = nextKind;
    scheduleDraw();
  }

  function rebuildMapping() {
    if (animationFrame) {
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }
    transition = null;
    displayedMapping = buildMapping(targetControl.value, Number(cellsControl.value));
    displayedKind = targetControl.value;
    draw(performance.now());
  }

  function draw(now = performance.now()) {
    const n = Number(cellsControl.value);
    const deflection = Number(deflectionControl.value);
    const renderState = getRenderState(now);
    const current = renderState.mapping;
    cellsValue.textContent = String(n);
    deflectionValue.textContent = `${deflection.toFixed(2).replace(/0$/, &quot;&quot;)}x`;

    const { width, height } = setCanvasSize();
    const bg = cssColor(&quot;--background&quot;, &quot;rgb(255, 255, 255)&quot;, &quot;backgroundColor&quot;);
    const fg = cssColor(&quot;--foreground&quot;, &quot;rgb(26, 28, 31)&quot;);
    const muted = cssColor(&quot;--muted-foreground&quot;, &quot;rgba(26, 28, 31, 0.55)&quot;);
    const border = cssColor(&quot;--border&quot;, &quot;rgba(26, 28, 31, 0.12)&quot;);
    const primary = cssColor(&quot;--viz-series-1&quot;, &quot;rgb(51, 156, 255)&quot;);
    const secondary = cssColor(&quot;--viz-series-2&quot;, &quot;rgb(243, 136, 59)&quot;);
    const accent = cssColor(&quot;--accent&quot;, &quot;rgb(229, 242, 255)&quot;, &quot;backgroundColor&quot;);

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);
    ctx.font = &quot;500 13px system-ui, -apple-system, BlinkMacSystemFont, sans-serif&quot;;
    ctx.textBaseline = &quot;alphabetic&quot;;

    const stack = width &lt; 520;
    const margin = stack ? 22 : 28;
    const labelGap = 24;
    const size = stack
      ? Math.min(width - margin * 2, (height - margin * 2 - 78) / 2)
      : Math.min((width - margin * 3) / 2, height - margin * 2 - labelGap);
    const plate = stack
      ? { x: (width - size) / 2, y: margin + labelGap, size }
      : { x: margin, y: margin + labelGap, size };
    const screen = stack
      ? { x: (width - size) / 2, y: plate.y + size + 58, size }
      : { x: width - margin - size, y: margin + labelGap, size };

    ctx.fillStyle = fg;
    ctx.fillText(&quot;computed caustic plate&quot;, plate.x, plate.y - 9);
    ctx.fillText(&quot;screen intensity&quot;, screen.x, screen.y - 9);

    ctx.strokeStyle = border;
    ctx.lineWidth = 1;
    drawRoundedRect(plate.x, plate.y, plate.size, plate.size, 8);
    ctx.stroke();
    drawRoundedRect(screen.x, screen.y, screen.size, screen.size, 8);
    ctx.stroke();

    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.18;
    drawRoundedRect(plate.x, plate.y, plate.size, plate.size, 8);
    ctx.fill();
    drawRoundedRect(screen.x, screen.y, screen.size, screen.size, 8);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.save();
    drawRoundedRect(screen.x, screen.y, screen.size, screen.size, 8);
    ctx.clip();
    ctx.globalCompositeOperation = &quot;source-over&quot;;
    ctx.fillStyle = primary;
    for (const ray of current) {
      const p = panelCoord(screen, {
        x: clamp(0.5 + (ray.target.x - 0.5) * deflection, 0.02, 0.98),
        y: clamp(0.5 + (ray.target.y - 0.5) * deflection, 0.02, 0.98)
      });
      ctx.globalAlpha = n &gt; 42 ? 0.045 : 0.065;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1.5, screen.size / n * 0.55), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowColor = primary;
    ctx.shadowBlur = Math.max(6, screen.size * 0.028);
    ctx.globalAlpha = 0.2;
    for (let i = 0; i &lt; current.length; i += Math.max(1, Math.floor(current.length / 220))) {
      const ray = current[i];
      const p = panelCoord(screen, {
        x: clamp(0.5 + (ray.target.x - 0.5) * deflection, 0.02, 0.98),
        y: clamp(0.5 + (ray.target.y - 0.5) * deflection, 0.02, 0.98)
      });
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(3, screen.size / n), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    const step = Math.max(2, Math.floor(n / 11));
    ctx.save();
    drawRoundedRect(plate.x, plate.y, plate.size, plate.size, 8);
    ctx.clip();
    ctx.strokeStyle = secondary;
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = 0.72;
    for (let i = 0; i &lt; current.length; i += 1) {
      const sx = Math.floor(current[i].source.x * n);
      const sy = Math.floor(current[i].source.y * n);
      if (sx % step || sy % step) continue;
      const a = panelCoord(plate, current[i].source);
      const dx = (current[i].target.x - current[i].source.x) * deflection;
      const dy = (current[i].target.y - current[i].source.y) * deflection;
      const len = Math.min(plate.size / n * 2.2, 13);
      const mag = Math.max(0.001, Math.hypot(dx, dy));
      drawArrow(a.x - dx / mag * len * 0.35, a.y - dy / mag * len * 0.35, a.x + dx / mag * len * 0.65, a.y + dy / mag * len * 0.65, 3.5);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    if (raysControl.checked) {
      const samples = [];
      const stride = Math.max(1, Math.floor(current.length / (stack ? 42 : 58)));
      for (let i = Math.floor(stride / 2); i &lt; current.length; i += stride) samples.push(current[i]);
      ctx.strokeStyle = primary;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.22;
      for (const ray of samples) {
        const a = panelCoord(plate, ray.source);
        const b = panelCoord(screen, {
          x: clamp(0.5 + (ray.target.x - 0.5) * deflection, 0.02, 0.98),
          y: clamp(0.5 + (ray.target.y - 0.5) * deflection, 0.02, 0.98)
        });
        ctx.beginPath();
        if (stack) {
          ctx.moveTo(a.x, a.y);
          ctx.bezierCurveTo(a.x, a.y + 26, b.x, b.y - 26, b.x, b.y);
        } else {
          ctx.moveTo(a.x, a.y);
          ctx.bezierCurveTo(a.x + 36, a.y, b.x - 36, b.y, b.x, b.y);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = muted;
    ctx.font = &quot;400 12px system-ui, -apple-system, BlinkMacSystemFont, sans-serif&quot;;
    if (stack) {
      ctx.fillText(&quot;uniform light in&quot;, plate.x, plate.y + plate.size + 20);
      ctx.fillText(&quot;designed rays out&quot;, screen.x, screen.y + screen.size + 20);
    } else {
      ctx.fillText(&quot;uniform light in&quot;, plate.x, plate.y + plate.size + 20);
      ctx.fillText(&quot;designed rays out&quot;, screen.x, screen.y + screen.size + 20);
    }

    const rayCount = n * n;
    const name = targetControl.options[targetControl.selectedIndex].text;
    status.textContent = renderState.transitioning
      ? `${rayCount.toLocaleString()} computed micro-prisms are morphing toward ${name.toLowerCase()} over 2 seconds.`
      : `${rayCount.toLocaleString()} computed micro-prisms map a flat beam into ${name.toLowerCase()} on the screen.`;
  }

  targetControl.addEventListener(&quot;input&quot;, startTargetTransition);
  cellsControl.addEventListener(&quot;input&quot;, rebuildMapping);
  deflectionControl.addEventListener(&quot;input&quot;, () =&gt; {
    draw(performance.now());
    if (transition) scheduleDraw();
  });
  raysControl.addEventListener(&quot;change&quot;, () =&gt; draw(performance.now()));
  window.addEventListener(&quot;resize&quot;, () =&gt; draw(performance.now()));
  draw();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
