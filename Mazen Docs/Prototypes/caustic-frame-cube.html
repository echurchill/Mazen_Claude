&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;caustic-frame-cube&quot;);

  const sequence = [&quot;box&quot;, &quot;focus&quot;, &quot;star&quot;, &quot;double&quot;, &quot;ring&quot;, &quot;triple&quot;, &quot;planet&quot;, &quot;spiral&quot;, &quot;solar&quot;, &quot;stickman&quot;];
  const names = {
    box: &quot;Cube&quot;,
    ring: &quot;Ring&quot;,
    focus: &quot;Focus&quot;,
    star: &quot;Star&quot;,
    double: &quot;Two spots&quot;,
    triple: &quot;Three spots&quot;,
    planet: &quot;Planet&quot;,
    spiral: &quot;Spiral&quot;,
    solar: &quot;Solar system&quot;,
    stickman: &quot;Stick man&quot;,
    quad: &quot;Four spots&quot;,
    infinity: &quot;Infinity&quot;,
    c: &quot;Letter C&quot;,
    tesseract: &quot;Flattened tesseract&quot;,
    obelisk: &quot;Obelisk&quot;,
    tardis: &quot;UK police box&quot;,
    heart: &quot;Heart&quot;
  };
  const framesPerTransition = 20;
  const grid = 48;
  const size = 512;
  let frameCount = 1 + (sequence.length - 1) * framesPerTransition;

  let rotation = { x: -26, y: 52 };
  let pointer = null;

  function cssColor(name, fallback) {
    colorProbe.style.color = `var(${name})`;
    const value = getComputedStyle(colorProbe).color;

  function rand(seed) {

    return () =&gt; {
      t += 0x6D2B79F5;
      let x = Math.imul(t ^ t &gt;&gt;&gt; 15, 1 | t);
      x ^= x + Math.imul(x ^ x &gt;&gt;&gt; 7, 61 | x);
      return ((x ^ x &gt;&gt;&gt; 14) &gt;&gt;&gt; 0) / 4294967296;
    };

  function hashTarget(name) {
    let h = 2166136261;
    for (const ch of name) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
    return h &gt;&gt;&gt; 0;
  }

  function morton(x, y) {
    let answer = 0;
    for (let i = 0; i &lt; 10; i += 1) {
      answer |= ((x &gt;&gt; i) &amp; 1) &lt;&lt; (2 * i);
      answer |= ((y &gt;&gt; i) &amp; 1) &lt;&lt; (2 * i + 1);
    }
    return answer;
  }

  function jitterPoint(x, y, random, amount) {
    const a = random() * Math.PI * 2;
    const r = (random() - 0.5) * amount;
    return { x: x + Math.cos(a) * r, y: y + Math.sin(a) * r };
  }

  function linePoint(x1, y1, x2, y2, random, amount = 0.025) {
    const t = random();
    return jitterPoint(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, random, amount);
  }

  function ellipsePoint(cx, cy, rx, ry, random, amount = 0.022, start = 0, span = Math.PI * 2) {
    const a = start + random() * span;
    return jitterPoint(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, random, amount);
  }

  function polylinePoint(points, random, amount = 0.022) {
    const lengths = [];
    let total = 0;
    for (let i = 1; i &lt; points.length; i += 1) {
      const length = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
      lengths.push(length);
      total += length;
    }
    let walk = random() * total;
    for (let i = 0; i &lt; lengths.length; i += 1) {
      if (walk &lt;= lengths[i]) {
        const t = lengths[i] ? walk / lengths[i] : 0;
        return jitterPoint(
          points[i].x + (points[i + 1].x - points[i].x) * t,
          points[i].y + (points[i + 1].y - points[i].y) * t,
          random,
          amount
        );
      }
      walk -= lengths[i];
    }
    const last = points[points.length - 1];
    return jitterPoint(last.x, last.y, random, amount);
  }

  function targetPoint(kind, random) {
    if (kind === &quot;focus&quot;) {
      const a = random() * Math.PI * 2;
      const r = Math.sqrt(random()) * 0.075;
      return { x: 0.5 + Math.cos(a) * r, y: 0.5 + Math.sin(a) * r };
    }

    if (kind === &quot;ring&quot;) {
      const a = random() * Math.PI * 2;
      const r = 0.305 + (random() - 0.5) * 0.055;
      return { x: 0.5 + Math.cos(a) * r, y: 0.5 + Math.sin(a) * r };
    }

    if (kind === &quot;double&quot;) {
      const left = random() &lt; 0.5;
      const a = random() * Math.PI * 2;
      const r = Math.sqrt(random()) * 0.09;
      return { x: (left ? 0.36 : 0.64) + Math.cos(a) * r, y: 0.5 + Math.sin(a) * r };
    }

    if (kind === &quot;triple&quot;) {
      const centers = [
        { x: 0.5, y: 0.31 },
        { x: 0.34, y: 0.62 },
        { x: 0.66, y: 0.62 }
      ];
      const center = centers[Math.floor(random() * centers.length)];
      const a = random() * Math.PI * 2;
      const r = Math.sqrt(random()) * 0.07;
      return { x: center.x + Math.cos(a) * r, y: center.y + Math.sin(a) * r };
    }

    if (kind === &quot;star&quot;) {
      const points = [];
      for (let i = 0; i &lt;= 8; i += 1) {
        const a = -Math.PI / 2 + i * Math.PI / 4;
        const r = i % 2 === 0 ? 0.32 : 0.12;
        points.push({ x: 0.5 + Math.cos(a) * r, y: 0.5 + Math.sin(a) * r });
      }
      return polylinePoint(points, random, 0.024);
    }

    if (kind === &quot;planet&quot;) {
      if (random() &lt; 0.58) return ellipsePoint(0.5, 0.5, 0.19, 0.19, random, 0.02);
      const t = random() * Math.PI * 2;
      const x = 0.5 + Math.cos(t) * 0.36;
      const y = 0.5 + Math.sin(t) * 0.105 + Math.cos(t) * 0.035;
      return jitterPoint(x, y, random, 0.018);
    }

    if (kind === &quot;spiral&quot;) {
      const t = 0.45 + random() * Math.PI * 4.7;
      const r = 0.023 * t;
      return jitterPoint(0.5 + Math.cos(t) * r, 0.5 + Math.sin(t) * r, random, 0.018);

    if (kind === &quot;stickman&quot;) {
      const pick = random();
      if (pick &lt; 0.22) return ellipsePoint(0.5, 0.27, 0.085, 0.085, random, 0.018);
      if (pick &lt; 0.42) return linePoint(0.5, 0.36, 0.5, 0.59, random);
      if (pick &lt; 0.56) return linePoint(0.5, 0.43, 0.34, 0.52, random);
      if (pick &lt; 0.7) return linePoint(0.5, 0.43, 0.66, 0.52, random);
      if (pick &lt; 0.85) return linePoint(0.5, 0.59, 0.37, 0.76, random);

    }

    if (kind === &quot;box&quot;) {
      const front = [
        { x: 0.31, y: 0.35 },
        { x: 0.63, y: 0.35 },
        { x: 0.63, y: 0.67 },
        { x: 0.31, y: 0.67 },
        { x: 0.31, y: 0.35 }

        { x: 0.43, y: 0.24 },
        { x: 0.75, y: 0.24 },
        { x: 0.75, y: 0.56 },
        { x: 0.43, y: 0.56 },
        { x: 0.43, y: 0.24 }

      const connectors = [
        { x: 0.31, y: 0.35 },
        { x: 0.43, y: 0.24 },
        { x: 0.63, y: 0.35 },
        { x: 0.75, y: 0.24 },
        { x: 0.63, y: 0.67 },
        { x: 0.75, y: 0.56 },
        { x: 0.31, y: 0.67 },
        { x: 0.43, y: 0.56 }

      const pick = random();

      if (pick &lt; 0.74) return polylinePoint(back, random, 0.02);

    if (kind === &quot;quad&quot;) {
      const centers = [
        { x: 0.36, y: 0.36 },
        { x: 0.64, y: 0.36 },
        { x: 0.36, y: 0.64 },
        { x: 0.64, y: 0.64 }
      ];
      const center = centers[Math.floor(random() * centers.length)];
      const a = random() * Math.PI * 2;
      const r = Math.sqrt(random()) * 0.065;
      return { x: center.x + Math.cos(a) * r, y: center.y + Math.sin(a) * r };

    if (kind === &quot;infinity&quot;) {

    if (kind === &quot;solar&quot;) {

      if (pick &lt; 0.16) return ellipsePoint(0.5, 0.5, 0.055, 0.055, random, 0.018);
      if (pick &lt; 0.42) return ellipsePoint(0.5, 0.5, 0.16, 0.08, random, 0.016);
      if (pick &lt; 0.68) return ellipsePoint(0.5, 0.5, 0.25, 0.125, random, 0.016);
      if (pick &lt; 0.9) return ellipsePoint(0.5, 0.5, 0.34, 0.17, random, 0.016);
      const planets = [
        { x: 0.66, y: 0.5, r: 0.028 },
        { x: 0.31, y: 0.59, r: 0.032 },
        { x: 0.79, y: 0.39, r: 0.024 }
      ];
      const planet = planets[Math.floor(random() * planets.length)];
      return ellipsePoint(planet.x, planet.y, planet.r, planet.r, random, 0.014);
    }

    if (kind === &quot;tesseract&quot;) {
      const outer = [
        { x: 0.14, y: 0.18 }, { x: 0.84, y: 0.18 },
        { x: 0.82, y: 0.72 }, { x: 0.22, y: 0.84 },
        { x: 0.31, y: 0.35 }, { x: 0.67, y: 0.31 },
        { x: 0.65, y: 0.64 }, { x: 0.35, y: 0.69 }

      const inner = outer.map((point) =&gt; ({
        x: 0.5 + (point.x - 0.5) * 0.42,

      const pairs = [
        [0, 1], [1, 2], [2, 3], [3, 0],
        [4, 5], [5, 6], [6, 7], [7, 4],
        [0, 4], [1, 5], [2, 6], [3, 7]

      const edges = [];
      for (const [a, b] of pairs) edges.push([outer[a], outer[b]]);
      for (const [a, b] of pairs) edges.push([inner[a], inner[b]]);
      for (let i = 0; i &lt; outer.length; i += 1) edges.push([outer[i], inner[i]]);
      let total = 0;
      for (const [a, b] of edges) total += Math.hypot(b.x - a.x, b.y - a.y);
      let walk = random() * total;
      for (const [a, b] of edges) {
        const length = Math.hypot(b.x - a.x, b.y - a.y);
        if (walk &lt;= length) return linePoint(a.x, a.y, b.x, b.y, random, 0.014);

      const [a, b] = edges[edges.length - 1];

    }

    if (kind === &quot;obelisk&quot;) {
      const shaft = [
        { x: 0.455, y: 0.225 }, { x: 0.405, y: 0.805 },
        { x: 0.595, y: 0.805 }, { x: 0.545, y: 0.225 },
        { x: 0.455, y: 0.225 }
      ];
      const cap = [
        { x: 0.5, y: 0.08 }, { x: 0.455, y: 0.225 },
        { x: 0.545, y: 0.225 }, { x: 0.5, y: 0.08 },
        { x: 0.5, y: 0.225 }
      ];
      const base = [
        { x: 0.36, y: 0.805 }, { x: 0.66, y: 0.805 },
        { x: 0.69, y: 0.86 }, { x: 0.31, y: 0.86 },
        { x: 0.36, y: 0.805 }
      ];
      const pick = random();
      if (pick &lt; 0.55) return polylinePoint(shaft, random, 0.014);
      if (pick &lt; 0.72) return polylinePoint(cap, random, 0.012);
      if (pick &lt; 0.86) return linePoint(0.5, 0.225, 0.5, 0.805, random, 0.012);
      return polylinePoint(base, random, 0.016);
    }

    if (kind === &quot;tardis&quot;) {
      const body = [
        { x: 0.32, y: 0.22 }, { x: 0.68, y: 0.22 },
        { x: 0.72, y: 0.78 }, { x: 0.28, y: 0.78 },
        { x: 0.32, y: 0.22 }
      ];
      const roof = [
        { x: 0.35, y: 0.16 }, { x: 0.65, y: 0.16 },
        { x: 0.68, y: 0.22 }, { x: 0.32, y: 0.22 },
        { x: 0.35, y: 0.16 }
      ];
      const panels = [
        { x: 0.35, y: 0.38 }, { x: 0.47, y: 0.38 }, { x: 0.47, y: 0.52 }, { x: 0.35, y: 0.52 }, { x: 0.35, y: 0.38 },
        { x: 0.53, y: 0.38 }, { x: 0.65, y: 0.38 }, { x: 0.65, y: 0.52 }, { x: 0.53, y: 0.52 }, { x: 0.53, y: 0.38 },
        { x: 0.35, y: 0.58 }, { x: 0.47, y: 0.58 }, { x: 0.47, y: 0.72 }, { x: 0.35, y: 0.72 }, { x: 0.35, y: 0.58 },
        { x: 0.53, y: 0.58 }, { x: 0.65, y: 0.58 }, { x: 0.65, y: 0.72 }, { x: 0.53, y: 0.72 }, { x: 0.53, y: 0.58 }
      ];
      const pick = random();
      if (pick &lt; 0.38) return polylinePoint(body, random, 0.018);
      if (pick &lt; 0.55) return polylinePoint(roof, random, 0.016);
      if (pick &lt; 0.65) return linePoint(0.5, 0.33, 0.5, 0.78, random, 0.016);
      return polylinePoint(panels, random, 0.014);
    }

    if (kind === &quot;heart&quot;) {
      const t = random() * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return jitterPoint(0.5 + x * 0.018, 0.54 - y * 0.018, random, 0.023);
    }

    const a = 0.28 * Math.PI + random() * 1.44 * Math.PI;
    const r = 0.305 + (random() - 0.5) * 0.065;
    return { x: 0.55 + Math.cos(a) * r, y: 0.5 + Math.sin(a) * r };
  }

  function buildMapping(kind) {
    const random = rand(hashTarget(kind) + grid * 97);
    const sources = [];
    const targets = [];
    for (let y = 0; y &lt; grid; y += 1) {
      for (let x = 0; x &lt; grid; x += 1) {
        const sx = (x + 0.5) / grid;
        const sy = (y + 0.5) / grid;
        sources.push({ x: sx, y: sy, order: morton(Math.floor(sx * 1023), Math.floor(sy * 1023)) });
        const t = targetPoint(kind, random);
        targets.push({ x: t.x, y: t.y, order: morton(Math.floor(t.x * 1023), Math.floor(t.y * 1023)) });
      }
    }
    sources.sort((a, b) =&gt; a.order - b.order);
    targets.sort((a, b) =&gt; a.order - b.order);
    return sources.map((source, i) =&gt; ({ source, target: targets[i] }));
  }

  function easeInOut(t) {
    return t &lt; 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function frameMapping(maps, index) {
    if (!transitionControl.checked) return maps[index];
    if (index === 0) return maps[0];
    const transition = Math.floor((index - 1) / framesPerTransition);
    const step = ((index - 1) % framesPerTransition + 1) / framesPerTransition;
    const t = easeInOut(step);
    const from = maps[transition];
    const to = maps[transition + 1];
    return from.map((ray, i) =&gt; ({
      source: ray.source,
      target: {
        x: ray.target.x + (to[i].target.x - ray.target.x) * t,
        y: ray.target.y + (to[i].target.y - ray.target.y) * t
      }
    }));
  }

  function drawSlice(canvas, mapping, hueIndex) {
    const ctx = canvas.getContext(&quot;2d&quot;);
    const image = ctx.createImageData(size, size);
    const data = image.data;
    const r = 80 + (hueIndex * 21) % 155;
    const g = 170 + (hueIndex * 13) % 70;
    const b = 255 - (hueIndex * 9) % 105;
    for (const ray of mapping) {
      const x = Math.max(8, Math.min(size - 9, Math.round(ray.target.x * size)));
      const y = Math.max(8, Math.min(size - 9, Math.round(ray.target.y * size)));
      for (let dy = -2; dy &lt;= 2; dy += 1) {
        for (let dx = -2; dx &lt;= 2; dx += 1) {
          const d2 = dx * dx + dy * dy;
          if (d2 &gt; 5) continue;
          const p = ((y + dy) * size + x + dx) * 4;
          const add = d2 === 0 ? 68 : d2 &lt;= 2 ? 38 : 18;
          data[p] = Math.min(255, data[p] + r * add / 255);
          data[p + 1] = Math.min(255, data[p + 1] + g * add / 255);
          data[p + 2] = Math.min(255, data[p + 2] + b * add / 255);
          data[p + 3] = Math.min(255, data[p + 3] + add);
        }
      }
    }
    ctx.putImageData(image, 0, 0);
  }

  function updateTransforms() {
    const opacity = Number(opacityControl.value);
    const depth = Number(depthControl.value);
    opacityValue.textContent = opacity.toFixed(2);
    depthValue.textContent = String(depth);
    cube.style.transform = `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`;
    const layers = cube.querySelectorAll(&quot;canvas&quot;);
    layers.forEach((layer, i) =&gt; {
      const z = -depth / 2 + depth * (i / Math.max(1, layers.length - 1));
      layer.style.opacity = String(opacity);
      layer.style.transform = `translateZ(${z}px)`;
    });
    cube.querySelectorAll(&quot;.cfc-slice-frame&quot;).forEach((frame) =&gt; {
      const i = Number(frame.dataset.frameIndex);
      const z = -depth / 2 + depth * (i / Math.max(1, frameCount - 1));
      frame.style.opacity = i === 0 || i === frameCount - 1 ? &quot;0.62&quot; : &quot;0.28&quot;;
      frame.style.transform = `translateZ(${z}px)`;
    });
    cube.querySelectorAll(&quot;.cfc-edge&quot;).forEach((edge) =&gt; {
      const x = Number(edge.dataset.x);
      const y = Number(edge.dataset.y);
      const z = Number(edge.dataset.z);
      const axis = edge.dataset.axis;
      if (axis === &quot;x&quot;) {
        edge.style.width = `${size}px`;
        edge.style.height = &quot;2px&quot;;
        edge.style.transform = `translate3d(0px, ${y}px, ${z * depth / 2}px)`;
      } else if (axis === &quot;y&quot;) {
        edge.style.width = &quot;2px&quot;;
        edge.style.height = `${size}px`;
        edge.style.transform = `translate3d(${x}px, 0px, ${z * depth / 2}px)`;
      } else {
        edge.style.width = &quot;2px&quot;;
        edge.style.height = `${depth}px`;
        edge.style.transform = `translate3d(${x}px, ${y}px, ${-depth / 2}px) rotateX(90deg)`;
      }
    });
  }

  function addSliceFrame(frag, index) {
    const frame = document.createElement(&quot;div&quot;);
    frame.className = &quot;cfc-slice-frame&quot;;
    frame.dataset.frameIndex = String(index);
    frag.appendChild(frame);
  }

  function addWireframe(frag) {
    const edges = [];
    for (const z of [-1, 1]) {
      edges.push({ axis: &quot;x&quot;, y: 0, z }, { axis: &quot;x&quot;, y: size, z });
      edges.push({ axis: &quot;y&quot;, x: 0, z }, { axis: &quot;y&quot;, x: size, z });
    }
    for (const x of [0, size]) {
      for (const y of [0, size]) edges.push({ axis: &quot;z&quot;, x, y });
    }
    for (const spec of edges) {
      const edge = document.createElement(&quot;div&quot;);
      edge.className = &quot;cfc-edge&quot;;
      edge.dataset.axis = spec.axis;
      edge.dataset.x = String(spec.x || 0);
      edge.dataset.y = String(spec.y || 0);
      edge.dataset.z = String(spec.z || 0);
      frag.appendChild(edge);
    }
  }

  function buildVolume() {
    const maps = sequence.map(buildMapping);
    const frag = document.createDocumentFragment();
    frameCount = transitionControl.checked
      ? 1 + (sequence.length - 1) * framesPerTransition
      : sequence.length;
    for (let i = 0; i &lt; frameCount; i += 1) {
      const canvas = document.createElement(&quot;canvas&quot;);
      canvas.width = size;
      canvas.height = size;
      drawSlice(canvas, frameMapping(maps, i), i);
      frag.appendChild(canvas);
      if (i === 0 || i === frameCount - 1 || i % (transitionControl.checked ? 10 : 1) === 0) addSliceFrame(frag, i);
    }
    addWireframe(frag);
    cube.replaceChildren(frag);
    const mode = transitionControl.checked ? &quot;with transition frames&quot; : &quot;keyframes only&quot;;
    status.textContent = `${frameCount} transparent 512 by 512 slices (${mode}) spread across a ${size} by ${size} by ${depthControl.value} frame cube.`;
    updateTransforms();
  }

  function animate() {
    if (isPlaying) {
      rotation.y += 0.12;
      updateTransforms();
    }
    requestAnimationFrame(animate);
  }

  playButton.addEventListener(&quot;click&quot;, () =&gt; {
    isPlaying = !isPlaying;
    playButton.textContent = isPlaying ? &quot;Pause&quot; : &quot;Play&quot;;
  });
  opacityControl.addEventListener(&quot;input&quot;, updateTransforms);
  depthControl.addEventListener(&quot;input&quot;, updateTransforms);
  transitionControl.addEventListener(&quot;change&quot;, buildVolume);
  cube.parentElement.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
    pointer = { x: event.clientX, y: event.clientY, rx: rotation.x, ry: rotation.y };
    cube.parentElement.setPointerCapture(event.pointerId);
  });
  cube.parentElement.addEventListener(&quot;pointermove&quot;, (event) =&gt; {
    if (!pointer) return;
    isPlaying = false;
    playButton.textContent = &quot;Play&quot;;
    rotation.x = pointer.rx - (event.clientY - pointer.y) * 0.25;
    rotation.y = pointer.ry + (event.clientX - pointer.x) * 0.25;
    updateTransforms();
  });
  cube.parentElement.addEventListener(&quot;pointerup&quot;, () =&gt; {
    pointer = null;
  });

  buildVolume();
  animate();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
